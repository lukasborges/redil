    <g fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">
      <path d="M52 39 C42 32 29 34 24 45 C20 54 22 64 28 66 C33 68 37 60 40 52 Z"/>
      <path d="M76 39 C86 32 99 34 104 45 C108 54 106 64 100 66 C95 68 91 60 88 52 Z"/>
      <path d="M64 98 C47 98 33 88 33 70 C33 52 46 36 64 36 C82 36 95 52 95 70 C95 88 81 98 64 98 Z"/>
    </g>
