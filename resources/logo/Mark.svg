<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    The mark without its box, for the places inside the app that already have a
    background of their own: the lock screen paints the rail's colour, and an
    app icon dropped on it reads as a square on a rectangle rather than as a
    mark. That colour is navy in the light theme and near-black in the dark
    one, where the dark coat would vanish, so the puppy wears a white outline
    around the whole silhouette, the way a sticker does.
  -->
