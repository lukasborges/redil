<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Redil, drawn to the GNOME app icon guidelines.

    The tray icon while something is unread: the same mark with the animal
    in the palette's red, which is the convention the icons before it used.

    The shape is the template's square guide: 104 by 104 with a radius of 8,
    centred on a 128 canvas, everything on the 2px grid. The base is flat
    because the guidelines reserve gradients for curved surfaces; the head has
    one, lit from straight above, because it is one. No shadow is drawn: the
    shell adds its own, and the guidelines ask for none inside the icon.

    Colours are the Adwaita palette. The blue is blue 5, the darkest of the
    five, which is as close as the palette comes to the navy this fork used
    before -- the circle and the gradient it inherited from Rambox were neither
    one of the three template shapes nor a flat surface, which is why the mark
    looked out of place beside GNOME's own.

    The animal is unchanged: a sheepdog, head and ears in a single outline so
    it survives 16px, where separate shapes merge into a blur.
  -->
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f66151"/>
      <stop offset="1" stop-color="#c01c28"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="104" height="104" rx="8" fill="#1a5fb4"/>
  <g transform="translate(27 27) scale(0.74)">
    <path fill="url(#coat)" d="M50 86 C44 86, 39 79, 38 71 C32 67, 28 59, 28 49 L25.2 18.5 C24.9 16, 27.2 15, 28.7 16.8 L44 33 C46 31, 54 31, 56 33 L71.3 16.8 C72.8 15, 75.1 16, 74.8 18.5 L72 49 C72 59, 68 67, 62 71 C61 79, 56 86, 50 86 Z"/>
  </g>
</svg>
