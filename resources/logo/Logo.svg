<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- Redil. A sheepdog: the one that guards the fold, rather than what the fold
       holds. The circle and the gradient are inherited from Rambox on purpose;
       the animal, and the direction the gradient lightens, are what set the two
       apart. Head and ears are a single outline, so the mark holds together at
       16px, where separate shapes merge into a blur. -->
  <defs>
    <linearGradient id="redil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57A6D4"/>
      <stop offset="1" stop-color="#15303F"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#redil)"/>
  <path fill="#FFFFFF" d="M50 86 C44 86, 39 79, 38 71 C32 67, 28 59, 28 49 L25.2 18.5 C24.9 16, 27.2 15, 28.7 16.8 L44 33 C46 31, 54 31, 56 33 L71.3 16.8 C72.8 15, 75.1 16, 74.8 18.5 L72 49 C72 59, 68 67, 62 71 C61 79, 56 86, 50 86 Z"/>
</svg>
