<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Redil, drawn to the GNOME app icon guidelines.

    The application icon.

    The shape is the template's square guide: 104 by 104 with a radius of 8,
    centred on a 128 canvas, on the 2px grid. No shadow is drawn: the shell
    adds its own, and the guidelines ask for none inside the icon.

    Colours are the Adwaita palette. The blue is blue 5, the darkest of the
    five, which is as close as the palette comes to the navy this fork used
    before.

    The animal is a sheepdog puppy with a border collie's coat: a dark head,
    a white blaze from the forehead that opens into the muzzle, and ears that
    fall to the sides. The folded ears are what tell a dog from a wolf, which
    in something called Redil -- a sheepfold -- is the one reading to avoid;
    the round head and the short muzzle are what make it a puppy. There are no
    eyes: the blaze and the nose are enough of a face, and the mark stays a
    shape rather than a character. Everything is flat colour, because a
    gradient on a two-tone coat muddies the blaze, which is the detail that
    survives down to 16px, where LogoSymbolic.svg draws it.
  -->
  <defs>
    <clipPath id="head"><path d="M64 98 C47 98 33 88 33 70 C33 52 46 36 64 36 C82 36 95 52 95 70 C95 88 81 98 64 98 Z"/></clipPath>
  </defs>
  <rect x="12" y="12" width="104" height="104" rx="8" fill="#1a5fb4"/>
  <g transform="translate(64 64) scale(0.92) translate(-64 -66)">
    <path fill="#241f31" d="M52 39 C42 32 29 34 24 45 C20 54 22 64 28 66 C33 68 37 60 40 52 Z"/>
    <path fill="#241f31" d="M76 39 C86 32 99 34 104 45 C108 54 106 64 100 66 C95 68 91 60 88 52 Z"/>
    <path fill="#241f31" d="M64 98 C47 98 33 88 33 70 C33 52 46 36 64 36 C82 36 95 52 95 70 C95 88 81 98 64 98 Z"/>
    <path fill="#ffffff" clip-path="url(#head)" d="M61.5 36 C62 45 62 51 60 57 C50 63 44 72 44 80 C44 92 54 98 64 98 C74 98 84 92 84 80 C84 72 78 63 68 57 C66 51 66 45 66.5 36 Z"/>
    <path fill="#241f31" d="M58.5 76 C58.5 73.5 69.5 73.5 69.5 76 C69.5 79 66 81 64 81 C62 81 58.5 79 58.5 76 Z"/>
  </g>
</svg>
