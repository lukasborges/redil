<!DOCTYPE HTML>
<html>
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Shep</title>
	<!--
		Only for the colour tokens and the interface font: this page has no Ext in
		it, so none of the rest of that file matches anything here. Loading it is
		what keeps the lock screen the same navy as the rail, in both themes.
	-->
	<link rel="stylesheet" href="resources/css/shep-modern.css">
	<style>
		/* The window is frameless, so the whole background drags it and the
		   controls opt back out. */
		html, body {
			height: 100%;
			margin: 0;
			-webkit-app-region: drag;
			-webkit-user-select: none;
			user-select: none;
		}

		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 22px;
			background-color: var(--rx-chrome);
			color: var(--rx-on-chrome);
		}

		img.mark {
			width: 96px;
			height: 96px;
		}

		h1 {
			margin: 0;
			font-size: 20px;
			font-weight: 600;
		}

		p.hint {
			margin: -14px 0 0;
			font-size: 13px;
			color: rgba(232, 241, 248, 0.68);
		}

		form {
			display: flex;
			gap: 8px;
			-webkit-app-region: no-drag;
		}

		input {
			width: 260px;
			box-sizing: border-box;
			padding: 10px 12px;
			font: inherit;
			font-size: 14px;
			color: var(--rx-ink);
			background-color: #FFFFFF;
			border: 1px solid transparent;
			border-radius: var(--rx-radius-lg);
			outline: none;
			-webkit-user-select: text;
			user-select: text;
		}

		input:focus {
			box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.22);
		}

		button {
			padding: 0 18px;
			font: inherit;
			font-size: 14px;
			font-weight: 600;
			color: var(--rx-on-chrome);
			background-color: rgba(255, 255, 255, 0.14);
			border: 1px solid rgba(255, 255, 255, 0.22);
			border-radius: var(--rx-radius-lg);
			cursor: pointer;
			transition: background-color 0.12s ease;
		}

		button:hover {
			background-color: rgba(255, 255, 255, 0.24);
		}

		p.wrong {
			margin: -12px 0 0;
			font-size: 13px;
			color: #FF9B9B;
		}

		a.exit {
			position: absolute;
			bottom: 28px;
			font-size: 13px;
			color: rgba(232, 241, 248, 0.6);
			text-decoration: none;
			-webkit-app-region: no-drag;
		}

		a.exit:hover {
			color: var(--rx-on-chrome);
			text-decoration: underline;
		}
	</style>
</head>
<body>
	<img class="mark" src="resources/Mark.png" alt="">
	<h1>Shep is locked</h1>
	<p class="hint">Enter your master password to carry on.</p>

	<form onsubmit="return unlock(event)">
		<input type="password" autofocus placeholder="Master password" oninput="clearWarning()" />
		<button type="submit">Unlock</button>
	</form>

	<p class="wrong" id="wrong-pass" hidden>That password is not right. Try again.</p>

	<a class="exit" href="#" onclick="exit()">Exit Shep</a>

	<script>
	function field() {
		return document.getElementsByTagName('input')[0];
	}

	function clearWarning() {
		document.getElementById('wrong-pass').hidden = true;
	}

	function unlock(event) {
		event.preventDefault();

		// A right password never comes back from this call: main creates the
		// application window and closes this one while the reply is in flight.
		if ( !shep.ipc.sendSync('validateMasterPassword', field().value) ) {
			field().value = '';
			field().focus();
			document.getElementById('wrong-pass').hidden = false;
		}

		return false;
	}

	function exit() {
		shep.ipc.send('app:quit');
	}
	</script>
</body>
</html>
