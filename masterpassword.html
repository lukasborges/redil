<!DOCTYPE HTML>
<html>
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Shep</title>
	<!--
		For the colour tokens and the .rx-lock rules, which the lock button's
		window in the app draws with too, so both locks are the same screen. This
		page has no Ext in it, so nothing else in that file matches here.
	-->
	<link rel="stylesheet" href="resources/css/shep-modern.css">
	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
	</style>
</head>
<body class="rx-lock">
	<img class="rx-lock-mark" src="resources/Mark.png" alt="">
	<h1 class="rx-lock-title">Shep is locked</h1>
	<p class="rx-lock-hint">Enter your master password to carry on.</p>

	<form class="rx-lock-form" onsubmit="return unlock(event)">
		<input class="rx-lock-field" type="password" autofocus placeholder="Master password" oninput="clearWarning()" />
		<button class="rx-lock-unlock" type="submit">Unlock</button>
	</form>

	<p class="rx-lock-wrong" id="wrong-pass" hidden>That password is not right. Try again.</p>

	<a class="rx-lock-exit" href="#" onclick="exit()">Exit Shep</a>

	<script>
	function field() {
		return document.getElementsByTagName('input')[0];
	}

	function clearWarning() {
		document.getElementById('wrong-pass').hidden = true;
	}

	function unlock(event) {
		event.preventDefault();

		// A right password never comes back from this call: main creates the
		// application window and closes this one while the reply is in flight.
		if ( !shep.ipc.sendSync('validateMasterPassword', field().value) ) {
			field().value = '';
			field().focus();
			document.getElementById('wrong-pass').hidden = false;
		}

		return false;
	}

	function exit() {
		shep.ipc.send('app:quit');
	}
	</script>
</body>
</html>
