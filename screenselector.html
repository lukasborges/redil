<!DOCTYPE html>
<html lang="en">
	<head>
		<!--
			For the colour tokens and the interface font. The picker is a window of
			the app's own, so it follows the same theme as everything else, including
			the dark one; nothing else in that file matches this page.
		-->
		<link rel="stylesheet" href="resources/css/redil-modern.css">
		<style type="text/css">
			/* The window is frameless and transparent: the card below is the window. */
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: transparent;
			}

			.screen-selector {
				display: flex;
				flex-direction: column;
				width: 100%;
				height: 100%;
				box-sizing: border-box;
				background-color: var(--rx-raised);
				border: 1px solid var(--rx-line);
				border-radius: 12px;
				box-shadow: 0 18px 48px var(--rx-shadow);
				overflow: hidden;
				color: var(--rx-ink);
			}

			/* the only place to grab a window with no frame */
			.screen-selector ul.type {
				display: flex;
				gap: 4px;
				margin: 0;
				padding: 0 14px;
				border-bottom: 1px solid var(--rx-line);
				-webkit-app-region: drag;
			}

			.screen-selector ul.type li {
				list-style: none;
				height: 44px;
				line-height: 44px;
				padding: 0 10px;
				font-size: 13px;
				color: var(--rx-muted);
				border-bottom: 2px solid transparent;
				cursor: pointer;
				-webkit-app-region: no-drag;
			}

			.screen-selector ul.type li:hover {
				color: var(--rx-ink);
			}

			.screen-selector ul.type li.active {
				color: var(--rx-ink);
				font-weight: 600;
				border-bottom-color: var(--rx-brand);
			}

			.screen-selector > .content {
				flex-grow: 1;
				min-height: 0;
			}

			.screen-selector ul.preview {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 6px;
				align-content: start;
				margin: 0;
				padding: 12px;
				height: 100%;
				box-sizing: border-box;
				overflow-y: auto;
				list-style-type: none;
			}

			.screen-selector ul.preview li {
				cursor: pointer;
			}

			.screen-selector ul.preview li .content {
				display: flex;
				flex-direction: column;
				height: 100%;
				box-sizing: border-box;
				padding: 8px;
				border: 1px solid transparent;
				border-radius: var(--rx-radius-lg);
				transition: background-color 0.12s ease, border-color 0.12s ease;
			}

			.screen-selector ul.preview li:hover .content {
				background-color: var(--rx-hover);
			}

			.screen-selector ul.preview li.active .content {
				border-color: var(--rx-brand);
				background-color: var(--rx-focus);
			}

			.screen-selector ul.preview li .content .img-wrapper {
				display: flex;
				align-items: center;
				justify-content: center;
				height: 96px;
				background-color: var(--rx-sunken);
				border-radius: var(--rx-radius);
				overflow: hidden;
			}

			.screen-selector ul.preview li .content img {
				max-width: 100%;
				max-height: 100%;
			}

			.screen-selector ul.preview li .content span {
				display: block;
				margin-top: 8px;
				font-size: 12px;
				color: var(--rx-muted);
				text-align: center;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.screen-selector ul.preview li.active .content span {
				color: var(--rx-ink);
			}

			.screen-selector .footer {
				display: flex;
				justify-content: flex-end;
				gap: 10px;
				padding: 12px 14px;
				border-top: 1px solid var(--rx-line);
			}

			.screen-selector .footer button {
				font: inherit;
				font-size: 13px;
				padding: 8px 16px;
				border-radius: var(--rx-radius);
				cursor: pointer;
				transition: background-color 0.12s ease;
			}

			.screen-selector .footer button#cancel {
				color: var(--rx-ink);
				background: none;
				border: 1px solid var(--rx-line-strong);
			}

			.screen-selector .footer button#cancel:hover {
				background-color: var(--rx-sunken);
			}

			.screen-selector .footer button#share {
				font-weight: 600;
				color: var(--rx-on-brand);
				background-color: var(--rx-brand);
				border: 1px solid var(--rx-brand);
			}

			.screen-selector .footer button#share:hover {
				background-color: var(--rx-brand-over);
				border-color: var(--rx-brand-over);
			}

			.screen-selector .footer button#share[disabled] {
				opacity: 0.45;
				cursor: not-allowed;
			}
		</style>
	</head>
	<body>
		<div class="screen-selector">
			<ul class="type">
				<li class="active" data-type="screen">Entire screen</li>
				<li data-type="window">Window</li>
			</ul>
			<div class="content">
				<ul class="preview"></ul>
			</div>
			<div class="footer">
				<button id="cancel">Cancel</button>
				<button id="share" disabled>Share</button>
			</div>
		</div>
		<script>
			const ipcRenderer = redil.ipc;

			let sourceList,
				contentList,
				typeButtons,
				shareButton,
				cancelButton,
				activeItem,
				activeTab = "screen";

			const getItemDOM = (item) => {
				const li = document.createElement("li");
				li.setAttribute("data-id", item.id);
				li.innerHTML = `<div class="content"><div class="img-wrapper"><img src="${item.thumbnail}" /></div><span>${item.name}</span></div>`;
				li.addEventListener("click", onItemClick, false);
				return li;
			};

			const updateTab = () => {
				const sources = sourceList.filter(
					(it) => it.id.indexOf(activeTab) === 0
				);
				contentList.innerHTML = "";
				sources.forEach((source) =>
					contentList.appendChild(getItemDOM(source))
				);
			};

			const bindTypeClick = () => {
				typeButtons.forEach((it) =>
					it.addEventListener("click", onChangeType, false)
				);
			};

			const bindActionsClick = () => {
				shareButton.addEventListener("click", onShareClick, false);
				cancelButton.addEventListener("click", onCancelClick, false);
			};

			const onChangeType = (event) => {
				event.preventDefault();
				if (!event.target.classList.contains("active")) {
					activeTab = event.target.dataset.type;
					typeButtons.forEach((it) => it.classList.remove("active"));
					event.target.classList.add("active");
					updateTab();
				}
			};

			const onItemClick = (event) => {
				event.preventDefault();
				if (!event.currentTarget.classList.contains("active")) {
					activeItem = event.currentTarget.dataset.id;
					document
						.querySelectorAll(".preview li")
						.forEach((it) => it.classList.remove("active"));
					event.currentTarget.classList.add("active");
					changeShareState();
				}
			};

			const onCancelClick = (event) => {
				event.preventDefault();
				ipcRenderer.send("screenShare:cancelSelection");
			};

			const onShareClick = (event) => {
				event.preventDefault();
				if (activeItem) {
					ipcRenderer.send("screenShare:selectScreen", activeItem);
				}
			};

			const changeShareState = () => {
				if (shareButton.getAttribute("disabled") !== null) {
					shareButton.removeAttribute("disabled");
				}
			};

			window.addEventListener(
				"load",
				async () => {
					sourceList = await ipcRenderer.invoke("screenShare:getSources");

					contentList = document.querySelector(".preview");
					typeButtons = document.querySelectorAll(".type li");
					shareButton = document.querySelector("#share");
					cancelButton = document.querySelector("#cancel");

					bindTypeClick();
					bindActionsClick();
					updateTab();
				},
				false
			);
		</script>
	</body>
</html>
