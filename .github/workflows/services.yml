name: Service catalogue

# resources/services.json went five years without anyone checking it, and by the
# time we looked, thirteen of its entries pointed at services that no longer
# exist. This is what stops that happening again.
#
# The job fails only on conclusive rot: a domain that does not resolve, or an
# address the host answers with 404. Timeouts and 403s are usually bot
# protection rather than a dead service, so they are reported and ignored.

on:
  schedule:
    # Mondays, early. A weekly nudge is enough for something that rots over years.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # scripts/check-services.js uses only Node built-ins, so there is nothing
      # to install.
      - name: Check every service URL
        run: node scripts/check-services.js
